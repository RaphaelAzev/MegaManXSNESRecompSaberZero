[Logging]
# 0 writes the session log to logs/mmx-*.log beside the executable (beside the
# .AppImage on Linux AppImages). On Windows no console opens.
# 1 keeps output in the terminal (Linux/macOS) or attaches/opens a diagnostic
# console (Windows). MMX_LOG_CONSOLE=1 does the same without editing this file.
# Explicit stdout/stderr redirection is preserved in either mode.
Console = 0
# Co-op collision diagnostics (also: --coop-trace or MMX_COOP_TRACE=1).
# 1 writes logs/mmx-coop-trace-*.log with context around detected faults and
# saves replayable snapshots beside it; "all" also logs every frame.
CoopTrace = 0
