[Logging]
# Windows: 0 opens only the launcher/game and writes diagnostics to logs/.
# Set to 1 to attach a parent console or open a diagnostic console instead.
# Explicit stdout/stderr redirection is preserved in either mode.
Console = 0
# Co-op collision diagnostics (also: --coop-trace or MMX_COOP_TRACE=1).
# 1 writes logs/mmx-coop-trace-*.log with context around detected faults and
# saves replayable snapshots beside it; "all" also logs every frame.
CoopTrace = 0
