format_version = 1
id = "megaman-x.coop"
version = "0.0.1"
name = "X / Zero Co-op"
author = "mstan"
description = "Play together as X and Zero with separate health and weapons."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "coop"
name = "Co-op"
description = "Player 2 joins automatically. Hold P2 Select for 1.5 seconds to leave; press Select to rejoin. Start opens each player's weapon menu. Selecting co-op turns off Add Zero."
group = "Characters"
default_enabled = false

[[option]]
feature = "coop"
id = "player1"
label = "Player 1 character"
description = "Player 2 plays as the other character."
type = "choice"
default = "x"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "zero"
label = "Zero"

[[resource]]
feature = "coop"
id = "x3-rom"
label = "Mega Man X3 ROM"
description = "Select your original Mega Man X3 USA ROM."
format = "file"
file_patterns = "*.sfc,*.smc"
file_description = "Mega Man X3 USA ROM"
shared_key = "megaman-x.source.x3"
normalized_sha256 = "65b03268afac296330e8ff8d60dd0825879e13ed658b37713c034a3bd074f1d7"
required = true

[[plugin]]
feature = "coop"
id = "megaman-x.coop"

# Claim the original character plugin too: features sharing a plugin are
# alternatives, so selecting co-op deselects Add Zero and vice versa.
[[plugin]]
feature = "coop"
id = "megaman-x.zero"
