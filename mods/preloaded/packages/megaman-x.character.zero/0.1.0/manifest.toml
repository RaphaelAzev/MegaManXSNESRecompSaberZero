format_version = 1
id = "megaman-x.character.zero"
version = "0.1.0"
name = "X3 Zero Experiment"
author = "mstan"
description = "Experimental playable-character port from Mega Man X3. Work in progress."
license = "MIT"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "zero"
name = "Play as Zero (experimental)"
description = "Use locally extracted X3 Zero assets. Development prototype; campaign validation is incomplete."
group = "Characters"
default_enabled = false

[[resource]]
feature = "zero"
id = "assets"
label = "Extracted X3 Zero assets"
description = "Choose zero-x3.bin produced by tools/extract_zero.py from your X3 USA ROM. Defaults to zero-x3.bin beside the executable."
format = "file"
file_patterns = "*.bin"
file_description = "Extracted Zero asset cache"
required = false

[[plugin]]
feature = "zero"
id = "megaman-x.zero"
